<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="smallEyeClip1">
      <path d="M 16 128 Q 128 28 240 128 Q 128 228 16 128 Z" />
    </clipPath>
  </defs>

  <!-- WoW Button Frame -->
  <rect x="6" y="6" width="244" height="244" rx="24" fill="#101016" stroke="#383846" stroke-width="8" />

  <!-- Clipped Horizon Scene -->
  <g clip-path="url(#smallEyeClip1)">
    <rect x="16" y="28" width="224" height="200" fill="#0d2a2c" />
    
    <!-- Centered Amber Sun -->
    <circle cx="128" cy="128" r="50" fill="#f2a61a" />
    
    <!-- High-Contrast Mountains -->
    <polygon points="10,215 82,138 135,178 192,128 246,215" fill="#12181f" />

    <!-- Soaring Eagle (Sized to sit cleanly INSIDE the tighter target box) -->
    <path d="M 102 118 Q 115 105 128 120 Q 141 105 154 118 Q 140 115 128 129 Q 116 115 102 118 Z" fill="#101016" />

    <!-- Tightened 4-Corner Target Box (72x64, well inside the eye curves & reticle ticks) -->
    <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="square" opacity="0.95">
      <!-- Top-Left -->
      <path d="M 92 112 L 92 96 L 108 96" />
      <!-- Top-Right -->
      <path d="M 148 96 L 164 96 L 164 112" />
      <!-- Bottom-Left -->
      <path d="M 92 144 L 92 160 L 108 160" />
      <!-- Bottom-Right -->
      <path d="M 148 160 L 164 160 L 164 144" />
    </g>
  </g>

  <!-- Thick Teal Eye Border & Reticle Ticks -->
  <path d="M 16 128 Q 128 28 240 128 Q 128 228 16 128 Z" fill="none" stroke="#00cc99" stroke-width="12" stroke-linejoin="round" />
  <line x1="128" y1="54" x2="128" y2="74" stroke="#00cc99" stroke-width="8" stroke-linecap="round" />
  <line x1="128" y1="182" x2="128" y2="202" stroke="#00cc99" stroke-width="8" stroke-linecap="round" />
  <line x1="42" y1="128" x2="62" y2="128" stroke="#00cc99" stroke-width="8" stroke-linecap="round" />
  <line x1="194" y1="128" x2="214" y2="128" stroke="#00cc99" stroke-width="8" stroke-linecap="round" />
</svg>